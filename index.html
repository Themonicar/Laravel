<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Scene</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
            min-width: 250px;
        }

        .controls h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #1a202c;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .control-group button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .control-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .control-group button:active {
            transform: translateY(0);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .button-group button {
            padding: 8px;
            font-size: 12px;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
            font-size: 13px;
            color: #4a5568;
        }

        .info strong {
            color: #1a202c;
        }

        @media (max-width: 768px) {
            .controls {
                top: 10px;
                left: 10px;
                right: 10px;
                padding: 15px;
                min-width: auto;
            }

            .info {
                bottom: 10px;
                left: 10px;
                right: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="controls">
        <h2>3D Controls</h2>
        
        <div class="control-group">
            <label>Shape</label>
            <div class="button-group">
                <button onclick="changeShape('cube')">Cube</button>
                <button onclick="changeShape('sphere')">Sphere</button>
                <button onclick="changeShape('torus')">Torus</button>
                <button onclick="changeShape('cone')">Cone</button>
            </div>
        </div>

        <div class="control-group">
            <label>Animation</label>
            <button onclick="toggleAnimation()">Toggle Rotation</button>
        </div>

        <div class="control-group">
            <label>Color</label>
            <div class="button-group">
                <button onclick="changeColor('#667eea')">Blue</button>
                <button onclick="changeColor('#f093fb')">Pink</button>
                <button onclick="changeColor('#4facfe')">Cyan</button>
                <button onclick="changeColor('#43e97b')">Green</button>
            </div>
        </div>
    </div>

    <div class="info">
        <strong>Drag</strong> to rotate • <strong>Scroll</strong> to zoom
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
